<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
<style>
    body {
        background-color: black;
        color: white;
    }
    
     .container {
    width: 70%;
    margin: auto;
}   
    


.post {
    background-color: #111;
    padding: 15px;
    margin-top: 20px;
    border-radius: 10px;
}





button{
background:white;
color:black;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#ddd;
}


.action-box {
    display: inline-block;
    border: 2px solid black;
    background-color: white;
    padding: 5px 10px;
    border-radius: 6px;
}

.action-box a {
    text-decoration: none;
    color: blue;
    margin: 0 5px;
    font-weight: bold;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.settings-btn{
    font-size:28px;
    text-decoration:none;
    background:#111;
    padding:10px 16px;
    border-radius:12px;
    color:white;
    transition:0.3s;
}

.settings-btn:hover{
    background:#333;
    transform:rotate(30deg);
}

.post-card {
background:#111;
padding:20px;
margin-top:25px;
border-radius:12px;
box-shadow:0 0 10px rgba(255,255,255,0.1);
}



body {
    font-family: 'Playfair Display', serif;
}

 
    
    
</style>




    <title>Huzail's Writing World</title>
</head>
<body>
<div class="container">
    <div class="header">
    <h1>Welcome to Huzail's Writing World 🌍</h1>
    {% if session.get("username") %}
    <a href="/logout">Logout</a>
    {% endif %}
    <a href="/settings" class="settings-btn">⚙️</a>
</div>

    <form action="/add" method="POST" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Title" required><br><br>
        <textarea name="content" placeholder="Write here..." required></textarea><br><br>
        <input type="file" name="image"><br><br>
        <button type="submit">Post</button>
    </form>
    <form action="/" method="GET">
    <input type="text"
           name="search"
           placeholder="🔍 Search posts..."
           style="padding:10px;width:300px;border-radius:8px;">
    <button type="submit">Search</button>
    </form>
<hr>

{% for post in posts %}

<div class="post-card">
<h2>{{ post.title }}</h2>
<p>{{ post.content }}</p>
{% if post.image %}
<img src="{{post.image}}"
     style="max-width:100%;
            border-radius:10px;
            margin-top:10px;">
{% endif %} 
<small>Posted on {{ post.time }}</small>
<p>❤️ {{ post.likes }}</p>

<a href="/like/{{post.id}}">
<button>Like</button>
</a>
<a href="/post/{{post.id}}">
    <button>Open Post 💬</button>
</a>

<form action="/comment/{{post.id}}" method="POST">
<input type="text" name="comment" placeholder="Write a comment">
<button type="submit">Comment</button>
</form>


</div>

<div class="action-box">
<a href="/edit/{{post.id}}">Edit</a> |
<a href="/delete/{{post.id}}" onclick="return confirm('Delete this post?')">Delete</a>
</div>

<hr>

{% endfor %}








</div>
<!-- Floating Chess Button -->
<a href="chess.html" class="chess-float">♟️</a>

<style>
.chess-float{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    background:#111;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    text-decoration:none;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    z-index:999;
}
.chess-float:hover{
    background:#333;
}
</style>
</body>
  </html>
